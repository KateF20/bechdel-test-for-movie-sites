name: Release

# Runs for version tags created by `npm version`, e.g. v2.0.1.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check that the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run check
      - run: npm test
      - run: npm run zip
      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: bechdel-test-for-movie-sites-*.zip
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" bechdel-test-for-movie-sites-*.zip --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  # Runs once CWS_ITEM_ID is set. Job conditions cannot read secrets, and the
  # item ID is public anyway; the account details are secrets.
  chrome-web-store:
    needs: package
    if: vars.CWS_ITEM_ID != ''
    runs-on: ubuntu-latest
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: extension
      # Keyless: GitHub's OIDC token is exchanged for a short-lived token of
      # the service account that the Chrome Web Store dashboard trusts.
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
      - run: node scripts/publish.ts bechdel-test-for-movie-sites-*.zip
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
